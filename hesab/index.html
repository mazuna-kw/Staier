<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3a5f">
<title>حسابات الشركاء</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e7ee;--brand:#1f3a5f;--in:#0f7b4f;--out:#b3261e;--soft:#eef3fa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
header{background:var(--brand);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;margin:0}
header button{background:rgba(255,255,255,.15);font-size:13px;padding:6px 12px}
main{max-width:760px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:14px 0 8px;color:var(--brand)}
.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft)}
.box b{display:block;font-size:15px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}
.num{font-variant-numeric:tabular-nums;font-weight:700;direction:ltr;unicode-bidi:isolate}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.danger{background:#fff;color:var(--out);border:1px solid #f1c5c2;padding:4px 10px;font-size:13px}
button.small{padding:6px 10px;font-size:14px}
button.big{width:100%;padding:14px;font-size:17px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.pick{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;cursor:pointer;font-size:17px;font-weight:600}
.pick input{width:22px;height:22px;margin:0}
.pick.on{border-color:var(--brand);background:var(--soft)}
.order{cursor:pointer}
.order .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--soft);border-radius:20px;padding:2px 10px}
.chip.done{background:#e3f4ec;color:var(--in)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.form{background:var(--soft);border-radius:12px;padding:10px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.total{background:var(--brand);color:#fff}
.total .muted{color:#d6deea}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:20;display:none}
.hidden{display:none!important}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1 id="title">حسابات الشركاء</h1><button id="switch" class="hidden">تغيير الشريك</button></header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" class="hidden">

<script>
(function(){
"use strict";
var ME="حامد", PARTNERS=["نواف","عبدالله الحميد","أبو عبدالرحمن"], KEY="hesab_data_v2";
var state={data:null,partner:null,pick:null,open:null};
var $=function(id){return document.getElementById(id)};

function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(function(){e.style.display="none"},2600)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){n=Math.round((+n||0)*1000)/1000;return n.toLocaleString("en-US",{maximumFractionDigits:3})+" د.ك"}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function load(){try{var j=localStorage.getItem(KEY);if(j)return JSON.parse(j);var old=localStorage.getItem("hesab_data_v1");return old?JSON.parse(old):{orders:[]}}catch(e){return {orders:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state.data));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();toast("تم الحفظ ✓");return true}catch(e){toast("تعذّر الحفظ");return false}}

function myOrders(){return state.data.orders.filter(function(o){return o.partner===state.partner})}
function people(){return [ME,state.partner]}
function ot(o){var g=0,s=0;(o.deposits||[]).forEach(function(d){g+=+d.amount||0});(o.expenses||[]).forEach(function(x){s+=+x.amount||0});return {got:g,spent:s,left:(+o.price||0)-g}}
function personTotals(list){var t={};people().forEach(function(p){t[p]={got:0,paid:0}});list.forEach(function(o){(o.deposits||[]).forEach(function(d){if(t[d.by])t[d.by].got+=+d.amount||0});(o.expenses||[]).forEach(function(x){if(t[x.by])t[x.by].paid+=+x.amount||0})});return t}

/* الحساب 50% × 50% على المبلغ الكامل للطلبية: الربح = سعر الطلبيات − المصروفات.
   باقي لكل شريك = ما دفعه + نصف الربح − ما استلمه (موجب: له، سالب: عليه).
   مجموع «الباقي» للاثنين = الباقي على الزبون، ويُستلم منه لاحقاً */
function settle(list){var t=personTotals(list),P=0,S=0,R=0;list.forEach(function(o){var x=ot(o);P+=+o.price||0;S+=x.spent;R+=x.got});var profit=P-S;people().forEach(function(p){var x=t[p];x.share=profit/2;x.due=x.paid+x.share-x.got});return {t:t,profit:profit,price:P,spent:S,left:P-R}}
function settleText(r){
  var ps=people(),a=r.t[ps[0]].due,b=r.t[ps[1]].due,E=0.0005;
  if(a<-E)return ps[0]+" يدفع لـ "+ps[1]+" "+money(-a)+(r.left>E?"، والباقي على الزبون "+money(r.left)+" لـ "+ps[1]:"");
  if(b<-E)return ps[1]+" يدفع لـ "+ps[0]+" "+money(-b)+(r.left>E?"، والباقي على الزبون "+money(r.left)+" لـ "+ps[0]:"");
  if(r.left>E)return "لا تحويل بينكم الآن. عند استلام الباقي من الزبون ("+money(r.left)+"): "+ps[0]+" "+money(a)+" و"+ps[1]+" "+money(b);
  return Math.abs(a)<E?"الحساب متساوي، لا أحد عليه شيء":(a>0?ps[1]+" يدفع لـ "+ps[0]+" "+money(a):ps[0]+" يدفع لـ "+ps[1]+" "+money(-a));
}
function settleHTML(list,title){
  var r=settle(list),ps=people(),h='<div class="card"><h2>'+title+'</h2><div class="row"><span>سعر الطلبيات كامل</span><span class="num">'+money(r.price)+'</span></div><div class="row"><span>المصروفات</span><span class="num">'+money(r.spent)+'</span></div><div class="row" style="font-size:15px"><span>صافي الربح</span><span class="num '+(r.profit<0?"out":"in")+'">'+money(r.profit)+'</span></div>'+(r.left>0.0005?'<div class="row"><span>الباقي على الزبون</span><span class="num">'+money(r.left)+'</span></div>':'')+'<p class="muted">القسمة 50% × 50% على المبلغ الكامل.</p><div class="grid2">';
  ps.forEach(function(p){var x=r.t[p];h+='<div class="box"><b>'+esc(p)+'</b><div class="row"><span>استلم</span><span class="num">'+money(x.got)+'</span></div><div class="row"><span>دفع</span><span class="num">'+money(x.paid)+'</span></div><div class="row"><span>نصيبه من الربح</span><span class="num">'+money(x.share)+'</span></div><div class="row" style="font-size:15px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span>'+(x.due>=0?"باقي له":"عليه")+'</span><span class="num '+(x.due>=0?"in":"out")+'">'+money(Math.abs(x.due))+'</span></div></div>'});
  return h+'</div><div class="box" style="margin-top:10px;text-align:center;background:#1f3a5f;color:#fff"><b>'+esc(settleText(r))+'</b></div></div>'}

function render(){
  $("switch").classList.toggle("hidden",!state.partner);
  $("title").textContent=state.partner?"حسابات "+state.partner:"حسابات الشركاء";
  if(!state.partner)return $("view").innerHTML=pickView();
  $("view").innerHTML=state.open?orderView(state.open):partnerView();
}

/* 1) اختيار الشريك */
function pickView(){
  var h='<div class="card"><h2>اختر الشريك</h2>';
  PARTNERS.forEach(function(p){var n=state.data.orders.filter(function(o){return o.partner===p}).length;h+='<label class="pick'+(state.pick===p?" on":"")+'" data-pick="'+esc(p)+'"><input type="radio" name="p"'+(state.pick===p?" checked":"")+'><span style="flex:1">'+esc(p)+'</span><span class="muted">'+n+' طلبية</span></label>'});
  h+='<button class="big" id="ok"'+(state.pick?"":" disabled style=\"opacity:.5\"")+'>موافق</button></div>';
  h+='<div class="card"><h2>النسخ الاحتياطي</h2><p class="muted">البيانات محفوظة في هذا الجهاز فقط. خذ نسخة بين فترة وأخرى.</p><div class="actions"><button class="ghost small" id="exp">حفظ نسخة احتياطية</button><button class="ghost small" id="impBtn">استرجاع نسخة</button></div></div>';
  return h;
}

/* 2) بيانات الشريك: الزبائن والطلبيات */
function partnerView(){
  var list=myOrders(),t=personTotals(list),G=0,S=0,L=0;
  list.forEach(function(o){var x=ot(o);G+=x.got;S+=x.spent;if(!o.done)L+=Math.max(0,x.left)});
  var h='<div class="card"><h2>زبون وطلبية جديدة</h2><label>اسم الزبون</label><input id="nName"><label>الطلبية</label><input id="nDesc"><div class="grid2"><div><label>السعر المتفق عليه (د.ك)</label><input id="nPrice" type="number" inputmode="decimal" step="0.001"></div><div><label>التاريخ</label><input id="nDate" type="date" value="'+today()+'"></div></div><label>رقم الزبون (اختياري)</label><input id="nPhone" inputmode="tel"><div class="actions"><button id="nAdd" style="flex:1">إضافة</button></div></div>';
  h+='<h2 style="margin:16px 4px 8px">الطلبيات</h2>';
  if(!list.length)h+='<div class="card muted" style="text-align:center">لا توجد طلبيات مع '+esc(state.partner)+' بعد.</div>';
  list.slice().sort(function(a,b){return (a.done-b.done)||String(b.date).localeCompare(a.date)}).forEach(function(o){var x=ot(o);h+='<div class="card order" data-open="'+o.id+'"><div class="top"><b>'+esc(o.customer)+'</b><span class="muted">'+esc(o.date||"")+'</span></div><div class="muted">'+esc(o.desc||"")+'</div><div class="chips"><span class="chip">السعر '+money(o.price)+'</span><span class="chip">مستلم '+money(x.got)+'</span><span class="chip">مصروف '+money(x.spent)+'</span>'+(o.done?'<span class="chip done">منتهية</span>':'<span class="chip">الباقي '+money(x.left)+'</span>')+'</div></div>'});
  h+='<div class="card total"><div class="row"><span>المستلم من الزبائن</span><span class="num">'+money(G)+'</span></div><div class="row"><span>المصروف على الطلبيات</span><span class="num">'+money(S)+'</span></div><div class="row"><span>المستلم ناقص المصروف</span><span class="num">'+money(G-S)+'</span></div><div class="row"><span>الباقي على الزبائن</span><span class="num">'+money(L)+'</span></div><div class="muted">'+list.length+' طلبية</div></div>';
  h+=settleHTML(list,'الحساب بيننا (كل الطلبيات)').replace(/<\/div>$/,'');
  h+='<div class="actions"><button id="pdf" style="flex:1">📄 إرسال الملخص PDF لـ '+esc(state.partner)+'</button></div></div>';
  return h;
}

function opts(){return people().map(function(p){return '<option>'+esc(p)+'</option>'}).join("")}

/* 3) تفاصيل الطلبية */
function orderView(id){
  var o=state.data.orders.find(function(z){return z.id===id});if(!o){state.open=null;return partnerView()}
  var x=ot(o);
  var h='<div class="actions" style="margin:0 0 10px"><button class="ghost small" id="back">→ رجوع</button></div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between"><h2>'+esc(o.customer)+'</h2><span class="muted">'+esc(o.date||"")+'</span></div><div>'+esc(o.desc||"")+'</div>'+(o.phone?'<div class="muted">📞 <span class="num">'+esc(o.phone)+'</span></div>':'')+'<div class="chips"><span class="chip">السعر '+money(o.price)+'</span><span class="chip">مستلم '+money(x.got)+'</span><span class="chip">مصروف '+money(x.spent)+'</span><span class="chip">الباقي على الزبون '+money(x.left)+'</span></div><div class="actions"><button class="ghost small" id="toggleDone">'+(o.done?"إرجاعها مفتوحة":"تمت الطلبية ✓")+'</button><button class="danger" id="delOrder">حذف الطلبية</button></div></div>';
  h+='<div class="card"><h3>💰 العربون والدفعات من الزبون</h3>';
  if((o.deposits||[]).length){h+='<table><tr><th>التاريخ</th><th>المبلغ</th><th>من استلم</th><th>النوع</th><th></th></tr>';o.deposits.forEach(function(d){h+='<tr><td>'+esc(d.date)+'</td><td class="num in">'+money(d.amount)+'</td><td>'+esc(d.by)+'</td><td>'+esc(d.note||"")+'</td><td><button class="danger" data-deld="'+d.id+'">حذف</button></td></tr>'});h+='</table>'}else h+='<p class="muted">لا شيء بعد.</p>';
  h+='<div class="form"><div class="grid2"><div><label>المبلغ (د.ك)</label><input id="dAmt" type="number" inputmode="decimal" step="0.001"></div><div><label>من استلمه</label><select id="dBy">'+opts()+'</select></div></div><div class="grid2"><div><label>النوع</label><select id="dNote"><option>عربون</option><option>دفعة</option><option>باقي المبلغ</option></select></div><div><label>التاريخ</label><input id="dDate" type="date" value="'+today()+'"></div></div><div class="actions"><button id="dAdd">إضافة</button></div></div></div>';
  h+='<div class="card"><h3>🧾 المصروفات على الطلبية</h3>';
  if((o.expenses||[]).length){h+='<table><tr><th>التاريخ</th><th>المبلغ</th><th>من دفع</th><th>السبب</th><th></th></tr>';o.expenses.forEach(function(d){h+='<tr><td>'+esc(d.date)+'</td><td class="num out">'+money(d.amount)+'</td><td>'+esc(d.by)+'</td><td>'+esc(d.reason||"")+'</td><td><button class="danger" data-dele="'+d.id+'">حذف</button></td></tr>'});h+='</table>'}else h+='<p class="muted">لا شيء بعد.</p>';
  h+='<div class="form"><div class="grid2"><div><label>المبلغ (د.ك)</label><input id="eAmt" type="number" inputmode="decimal" step="0.001"></div><div><label>من دفع</label><select id="eBy">'+opts()+'</select></div></div><label>لماذا دفعها</label><input id="eWhy"><label>التاريخ</label><input id="eDate" type="date" value="'+today()+'"><div class="actions"><button id="eAdd">إضافة</button></div></div></div>';
  h+=settleHTML([o],'حساب هذه الطلبية');
  return h;
}

/* ملخص PDF: يُرسم على Canvas (يدعم العربية) ثم يُوضع في ملف PDF */
function buildPages(){
  var W=1240,H=1754,M=80,pages=[],c,ctx,y;
  var list=myOrders().slice().sort(function(a,b){return String(a.date).localeCompare(b.date)}),G=0,S=0,L=0;
  list.forEach(function(o){var x=ot(o);G+=x.got;S+=x.spent;if(!o.done)L+=Math.max(0,x.left)});
  function page(){c=document.createElement("canvas");c.width=W;c.height=H;ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.direction="rtl";ctx.textBaseline="top";pages.push(c);y=M}
  function font(s,b){ctx.font=(b?"bold ":"")+s+"px Tahoma, Arial, sans-serif"}
  function txt(s,x,size,bold,color,align){font(size,bold);ctx.fillStyle=color||"#1d2433";ctx.textAlign=align||"right";ctx.fillText(s,x,y)}
  function need(h){if(y+h>H-M){page()}}
  function line(){ctx.fillStyle="#e3e7ee";ctx.fillRect(M,y,W-2*M,2)}
  function fit(s,w,size){font(size);s=String(s||"");while(s.length>1&&ctx.measureText(s).width>w)s=s.slice(0,-2)+"…";return s}
  page();
  ctx.fillStyle="#1f3a5f";ctx.fillRect(0,0,W,170);y=50;txt("كشف حساب: "+ME+" و"+state.partner,W-M,44,true,"#fff");y=110;txt("التاريخ: "+today()+"   •   "+list.length+" طلبية",W-M,24,false,"#d6deea");
  y=210;
  [["المستلم من الزبائن",G],["المصروف على الطلبيات",S],["المستلم ناقص المصروف",G-S],["الباقي على الزبائن",L]].forEach(function(r){txt(r[0],W-M,28);txt(money(r[1]),M,28,true,"#1d2433","left");y+=48});
  y+=10;line();y+=24;
  var st=settle(list),ps=people();txt("سعر الطلبيات "+money(st.price)+"   •   المصروفات "+money(st.spent)+"   •   صافي الربح "+money(st.profit),W-M,26,true);y+=50;txt("القسمة 50% × 50% على المبلغ الكامل",W-M,22,false,"#6b7385");y+=50;
  ps.forEach(function(p){var x=st.t[p];txt(p,W-M,30,true,"#1f3a5f");y+=46;txt("استلم "+money(x.got)+"   •   دفع "+money(x.paid)+"   •   نصيبه "+money(x.share)+"   •   "+(x.due>=0?"باقي له ":"عليه ")+money(Math.abs(x.due)),W-M,25);y+=56});
  var stx=settleText(st);font(26,true);var lines=[],cur="";stx.split(" ").forEach(function(w0){var tr=cur?cur+" "+w0:w0;if(ctx.measureText(tr).width>W-2*M-40&&cur){lines.push(cur);cur=w0}else cur=tr});lines.push(cur);
  ctx.fillStyle="#1f3a5f";ctx.fillRect(M,y-8,W-2*M,20+lines.length*42);y+=6;lines.forEach(function(l){txt(l,W/2,26,true,"#fff","center");y+=42});y+=40;
  line();y+=30;txt("تفاصيل الطلبيات",W-M,32,true,"#1f3a5f");y+=60;
  list.forEach(function(o){
    var x=ot(o),rows=(o.deposits||[]).length+(o.expenses||[]).length;need(150+rows*40);
    ctx.fillStyle="#eef3fa";ctx.fillRect(M,y-10,W-2*M,96);
    txt(fit(o.customer+(o.desc?" — "+o.desc:""),W-2*M-260,28),W-M-16,28,true);txt(o.date||"",M+16,22,false,"#6b7385","left");y+=44;
    txt("السعر "+money(o.price)+"   •   مستلم "+money(x.got)+"   •   مصروف "+money(x.spent)+"   •   "+(o.done?"منتهية":"الباقي "+money(x.left)),W-M-16,22,false,"#40485a");y+=62;
    (o.deposits||[]).forEach(function(d){txt("+ "+(d.note||"دفعة")+" — استلمه "+d.by+" — "+d.date,W-M-16,22);txt(money(d.amount),M+16,22,true,"#0f7b4f","left");y+=40});
    (o.expenses||[]).forEach(function(d){txt(fit("− "+d.reason+" — دفعه "+d.by+" — "+d.date,W-2*M-240,22),W-M-16,22);txt(money(d.amount),M+16,22,true,"#b3261e","left");y+=40});
    y+=24;
  });
  pages.forEach(function(p,i){var cx=p.getContext("2d");cx.font="18px Tahoma, Arial";cx.fillStyle="#6b7385";cx.textAlign="center";cx.fillText((i+1)+" / "+pages.length,W/2,H-50)});
  return pages;
}
function dataURLBytes(u){var b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function makePDF(canvases){
  var parts=[],len=0,offs=[],enc=new TextEncoder();
  function add(x){var b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length}
  function obj(n,body){offs[n]=len;add(n+" 0 obj\n");body.forEach(add);add("\nendobj\n")}
  var n=canvases.length,kids=[];for(var i=0;i<n;i++)kids.push((3+i*3)+" 0 R");
  add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2,["<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>"]);
  canvases.forEach(function(cv,i){
    var p=3+i*3,img=dataURLBytes(cv.toDataURL("image/jpeg",0.85)),cs="q 595 0 0 842 0 0 cm /Im0 Do Q";
    obj(p,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 "+(p+1)+" 0 R >> >> /Contents "+(p+2)+" 0 R >>"]);
    obj(p+1,["<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+img.length+" >>\nstream\n",img,"\nendstream"]);
    obj(p+2,["<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"]);
  });
  var total=2+n*3,xref=len,s="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var k=1;k<=total;k++)s+=String(offs[k]).padStart(10,"0")+" 00000 n \n";
  add(s+"trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function sendPDF(){
  var blob=makePDF(buildPages()),name="كشف-حساب-"+state.partner.replace(/\s+/g,"-")+"-"+today()+".pdf";
  var file=new File([blob],name,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"كشف حساب "+state.partner});return}catch(e){if(e&&e.name==="AbortError")return}}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("تم تنزيل الملف، أرسله من واتساب");
}

function val(id){var e=$(id);return e?e.value.trim():""}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("button,[data-open],[data-pick]");if(!t)return;
  if(t.dataset.pick){state.pick=t.dataset.pick;return render()}
  if(t.id==="ok"&&state.pick){state.partner=state.pick;state.open=null;render();return scrollTo(0,0)}
  if(t.id==="switch"){state.partner=null;state.open=null;return render()}
  if(t.id==="exp"){var b=new Blob([JSON.stringify(state.data,null,1)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hesab-"+today()+".json";document.body.appendChild(a);a.click();a.remove();return}
  if(t.id==="impBtn")return $("imp").click();
  if(t.id==="pdf")return sendPDF();
  if(t.dataset.open){state.open=t.dataset.open;render();return scrollTo(0,0)}
  if(t.id==="back"){state.open=null;return render()}
  var o=state.open&&state.data.orders.find(function(z){return z.id===state.open});
  if(t.id==="nAdd"){var c=val("nName");if(!c)return toast("اكتب اسم الزبون");var no={id:uid(),partner:state.partner,customer:c,desc:val("nDesc"),price:+val("nPrice")||0,date:val("nDate")||today(),phone:val("nPhone"),done:false,deposits:[],expenses:[]};state.data.orders.push(no);save();state.open=no.id;render();return scrollTo(0,0)}
  if(t.id==="dAdd"&&o){var am=+val("dAmt");if(!am)return toast("اكتب المبلغ");o.deposits.push({id:uid(),amount:am,by:val("dBy"),note:val("dNote"),date:val("dDate")||today()});save();return render()}
  if(t.id==="eAdd"&&o){var b2=+val("eAmt");if(!b2)return toast("اكتب المبلغ");if(!val("eWhy"))return toast("اكتب سبب الدفع");o.expenses.push({id:uid(),amount:b2,by:val("eBy"),reason:val("eWhy"),date:val("eDate")||today()});save();return render()}
  if(t.dataset.deld&&o){if(!confirm("حذف هذا المبلغ؟"))return;o.deposits=o.deposits.filter(function(z){return z.id!==t.dataset.deld});save();return render()}
  if(t.dataset.dele&&o){if(!confirm("حذف هذا المصروف؟"))return;o.expenses=o.expenses.filter(function(z){return z.id!==t.dataset.dele});save();return render()}
  if(t.id==="toggleDone"&&o){o.done=!o.done;save();return render()}
  if(t.id==="delOrder"&&o){if(!confirm("حذف الطلبية بكل مبالغها؟"))return;state.data.orders=state.data.orders.filter(function(z){return z.id!==o.id});save();state.open=null;return render()}
});
$("imp").addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.orders))throw 0;if(!confirm("استبدال البيانات الحالية بالنسخة ("+d.orders.length+" طلبية)؟"))return;state.data=d;save();render()}catch(e){toast("الملف غير صالح")}};r.readAsText(f);this.value=""});

state.data=load();render();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
