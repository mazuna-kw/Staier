<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3a5f">
<title>حسابات الشركاء</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e7ee;--brand:#1f3a5f;--in:#0f7b4f;--out:#b3261e;--soft:#eef3fa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
header{background:var(--brand);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;margin:0}
header button{background:rgba(255,255,255,.15);font-size:13px;padding:6px 12px}
main{max-width:760px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:14px 0 8px;color:var(--brand)}
.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft)}
.box b{display:block;font-size:15px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}
.num{font-variant-numeric:tabular-nums;font-weight:700;direction:ltr;unicode-bidi:isolate}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.danger{background:#fff;color:var(--out);border:1px solid #f1c5c2;padding:4px 10px;font-size:13px}
button.small{padding:6px 10px;font-size:14px}
button.big{width:100%;padding:14px;font-size:17px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.pick{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;cursor:pointer;font-size:17px;font-weight:600}
.pick input{width:22px;height:22px;margin:0}
.pick.on{border-color:var(--brand);background:var(--soft)}
.order{cursor:pointer}
.order .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--soft);border-radius:20px;padding:2px 10px}
.chip.done{background:#e3f4ec;color:var(--in)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num,td.d{white-space:nowrap}
td.d{font-size:12px;color:var(--muted)}
.form{background:var(--soft);border-radius:12px;padding:10px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.total{background:var(--brand);color:#fff}
.total .muted{color:#d6deea}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:20;display:none}
.hidden{display:none!important}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1 id="title">حسابات الشركاء</h1><button id="switch" class="hidden">تغيير الشريك</button></header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" class="hidden">

<script>
(function(){
"use strict";
var ME="حامد", PARTNERS=["نواف","عبدالله الحميد","أبو عبدالرحمن"], KEY="hesab_data_v2";
var state={data:null,partner:null,pick:null,open:null,edit:null};
var $=function(id){return document.getElementById(id)};

function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(function(){e.style.display="none"},2600)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){n=Math.round((+n||0)*1000)/1000;return n.toLocaleString("en-US",{maximumFractionDigits:3})+" د.ك"}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function load(){try{var j=localStorage.getItem(KEY);if(j)return JSON.parse(j);var old=localStorage.getItem("hesab_data_v1");return old?JSON.parse(old):{orders:[]}}catch(e){return {orders:[]}}}
function save(){try{state.data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state.data));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();toast(gh()?"تم الحفظ ✓ (يُرفع على GitHub)":"تم الحفظ ✓");schedulePush();return true}catch(e){toast("تعذّر الحفظ");return false}}

/* ===== الحفظ على GitHub (مستودع خاص). التوكن يُدخل مرة واحدة ويُحفظ في هذا الجهاز ===== */
var GHK="hesab_github",FILE="hesab-data.json",ghSha=null,pushT=null,syncMsg="";
function gh(){try{var g=JSON.parse(localStorage.getItem(GHK)||"null");return g&&g.repo&&g.token?g:null}catch(e){return null}}
function b64u(str){return btoa(unescape(encodeURIComponent(str)))}
function unb64u(b){return decodeURIComponent(escape(atob(b.replace(/\n/g,""))))}
async function ghReq(method,body){var g=gh();var r=await fetch("https://api.github.com/repos/"+g.repo+"/contents/"+FILE+(method==="GET"?"?t="+Date.now():""),{method:method,cache:"no-store",headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+g.token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});return r}
async function ghGet(){var r=await ghReq("GET");if(r.status===404){ghSha=null;return null}if(!r.ok)throw new Error(String(r.status));var j=await r.json();ghSha=j.sha;return JSON.parse(unb64u(j.content))}
function setSync(t){syncMsg=t;var e=$("syncStatus");if(e)e.textContent=t}
function schedulePush(){if(!gh())return;clearTimeout(pushT);setSync("⏳ جاري الرفع…");pushT=setTimeout(push,1200)}
async function push(retry){
  if(!gh())return;if(!navigator.onLine){setSync("⚠️ لا يوجد إنترنت — سيُرفع عند الاتصال");return}
  try{
    if(ghSha===null){try{await ghGet()}catch(e){}}
    var body={message:"تحديث الحسابات "+new Date().toLocaleString("en-GB"),content:b64u(JSON.stringify(state.data,null,1))};if(ghSha)body.sha=ghSha;
    var r=await ghReq("PUT",body);
    if((r.status===409||r.status===422)&&!retry){ghSha=null;return push(true)}
    if(r.status===401||r.status===403){setSync("⚠️ التوكن غير صالح أو بدون صلاحية كتابة");return}
    if(r.status===404){setSync("⚠️ المستودع غير موجود أو التوكن لا يصل إليه");return}
    if(!r.ok){setSync("⚠️ تعذّر الرفع ("+r.status+")");return}
    var j=await r.json();ghSha=j.content.sha;localStorage.setItem(GHK+"_last",new Date().toISOString());setSync("✅ محفوظ على GitHub — "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){setSync("⚠️ تعذّر الرفع، سأحاول عند الحفظ القادم")}
}
window.addEventListener("online",function(){if(gh())schedulePush()});
async function connectGH(){
  var cur=gh()||{};var repo=prompt("اسم المستودع الخاص (الحساب/الاسم):",cur.repo||"mazuna-kw/hesab-data");if(!repo)return;repo=repo.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");
  var token=prompt("الصق توكن GitHub (مرة واحدة فقط على هذا الجهاز):");if(!token)return;
  try{localStorage.setItem(GHK,JSON.stringify({repo:repo,token:token.trim()}))}catch(e){}
  setSync("⏳ جاري الاتصال…");render();
  try{var remote=await ghGet();
    if(remote&&Array.isArray(remote.orders)&&remote.orders.length&&!state.data.orders.length){state.data=remote;localStorage.setItem(KEY,JSON.stringify(remote));toast("تم استرجاع الحسابات من GitHub");render()}
    else if(remote&&remote.orders&&remote.orders.length&&state.data.orders.length&&confirm("على GitHub نسخة فيها "+remote.orders.length+" طلبية. استبدال بيانات هذا الجهاز بها؟\n(إلغاء = رفع بيانات هذا الجهاز فوقها)")){state.data=remote;localStorage.setItem(KEY,JSON.stringify(remote));render();setSync("✅ متصل — تم الاسترجاع");return}
    await push();
  }catch(e){setSync(e.message==="401"||e.message==="403"?"⚠️ التوكن غير صالح":"⚠️ تعذّر الاتصال بالمستودع")}
}
async function pullGH(){if(!gh())return;try{var remote=await ghGet();if(!remote)return toast("لا توجد نسخة على GitHub بعد");if(!confirm("استبدال بيانات هذا الجهاز بنسخة GitHub ("+remote.orders.length+" طلبية)؟"))return;state.data=remote;localStorage.setItem(KEY,JSON.stringify(remote));state.open=null;render();toast("تم الاسترجاع من GitHub")}catch(e){toast("تعذّر الاسترجاع")}}
function syncCard(){
  var g=gh();
  if(!g)return '<div class="card"><h2>☁️ الحفظ على GitHub</h2><p class="muted">اربط مستودعاً خاصاً مرة واحدة، وبعدها كل تعديل يُرفع تلقائياً، وتقدر تسترجع الحسابات على أي جهاز.</p><div class="actions"><button id="ghConnect" style="flex:1">ربط GitHub</button></div></div>';
  return '<div class="card"><h2>☁️ الحفظ على GitHub</h2><p class="muted">مربوط بـ <b class="num">'+esc(g.repo)+'</b></p><p id="syncStatus" style="margin:6px 0">'+esc(syncMsg||"✅ مربوط")+'</p><div class="actions"><button class="ghost small" id="ghPush">رفع الآن</button><button class="ghost small" id="ghPull">استرجاع من GitHub</button><a class="ghost small" style="text-decoration:none;border:1px solid var(--brand);border-radius:10px;padding:6px 10px;color:var(--brand)" target="_blank" rel="noopener" href="https://github.com/'+esc(g.repo)+'/blob/HEAD/'+FILE+'">فتح على GitHub</a><button class="danger" id="ghOff">إلغاء الربط</button></div></div>';
}

function myOrders(){return state.data.orders.filter(function(o){return o.partner===state.partner})}
function people(){return [ME,state.partner]}
function ot(o){var g=0,s=0;(o.deposits||[]).forEach(function(d){g+=+d.amount||0});(o.expenses||[]).forEach(function(x){s+=+x.amount||0});return {got:g,spent:s,left:(+o.price||0)-g}}
function personTotals(list){var t={};people().forEach(function(p){t[p]={got:0,paid:0}});list.forEach(function(o){(o.deposits||[]).forEach(function(d){if(t[d.by])t[d.by].got+=+d.amount||0});(o.expenses||[]).forEach(function(x){if(t[x.by])t[x.by].paid+=+x.amount||0})});return t}

/* الحساب 50% × 50% على المبلغ الكامل للطلبية: الربح = سعر الطلبيات − المصروفات.
   باقي لكل شريك = ما دفعه + نصف الربح − ما استلمه (موجب: له، سالب: عليه).
   مجموع «الباقي» للاثنين = الباقي على الزبون، ويُستلم منه لاحقاً */
function settle(list){var t=personTotals(list),P=0,S=0,R=0;list.forEach(function(o){var x=ot(o);P+=+o.price||0;S+=x.spent;R+=x.got});var profit=P-S;people().forEach(function(p){var x=t[p];x.share=profit/2;x.due=x.paid+x.share-x.got});return {t:t,profit:profit,price:P,spent:S,left:P-R}}
function settleText(r){
  var ps=people(),a=r.t[ps[0]].due,b=r.t[ps[1]].due,E=0.0005;
  if(a<-E)return ps[0]+" يدفع لـ "+ps[1]+" "+money(-a)+(r.left>E?"، والباقي على الزبون "+money(r.left)+" لـ "+ps[1]:"");
  if(b<-E)return ps[1]+" يدفع لـ "+ps[0]+" "+money(-b)+(r.left>E?"، والباقي على الزبون "+money(r.left)+" لـ "+ps[0]:"");
  if(r.left>E){var parts=[];if(a>E)parts.push(ps[0]+" "+money(a));if(b>E)parts.push(ps[1]+" "+money(b));return "لا تحويل بينكم الآن. الباقي على الزبون ("+money(r.left)+") يذهب لـ "+parts.join(" و")}
  return Math.abs(a)<E?"الحساب متساوي، لا أحد عليه شيء":(a>0?ps[1]+" يدفع لـ "+ps[0]+" "+money(a):ps[0]+" يدفع لـ "+ps[1]+" "+money(-a));
}
function settleHTML(list,title){
  var r=settle(list),ps=people(),h='<div class="card"><h2>'+title+'</h2><div class="row"><span>'+(list.length===1?'سعر الطلبية':'سعر الطلبيات كامل')+'</span><span class="num">'+money(r.price)+'</span></div><div class="row"><span>المصروفات</span><span class="num">'+money(r.spent)+'</span></div><div class="row" style="font-size:15px"><span>صافي الربح</span><span class="num '+(r.profit<0?"out":"in")+'">'+money(r.profit)+'</span></div>'+(r.left>0.0005?'<div class="row"><span>الباقي على الزبون</span><span class="num">'+money(r.left)+'</span></div>':'')+'<p class="muted">القسمة 50% × 50% على المبلغ الكامل.</p><div class="grid2">';
  ps.forEach(function(p){var x=r.t[p];h+='<div class="box"><b>'+esc(p)+'</b><div class="row"><span>استلم</span><span class="num">'+money(x.got)+'</span></div><div class="row"><span>دفع</span><span class="num">'+money(x.paid)+'</span></div><div class="row"><span>نصيبه من الربح</span><span class="num">'+money(x.share)+'</span></div><div class="row" style="font-size:15px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span>'+(x.due>=0?"باقي له":"عليه")+'</span><span class="num '+(x.due>=0?"in":"out")+'">'+money(Math.abs(x.due))+'</span></div></div>'});
  return h+'</div><div class="box" style="margin-top:10px;text-align:center;background:#1f3a5f;color:#fff"><b>'+esc(settleText(r))+'</b></div></div>'}


/* دفتر كل شخص: كل ما استلمه وكل ما دفعه، لمن ولماذا */
function ledger(list,p){var got=[],paid=[];list.forEach(function(o){var on=o.customer+(o.desc?" — "+o.desc:"");(o.deposits||[]).forEach(function(d){if(d.by===p)got.push({date:d.date,order:on,what:(d.note||"دفعة")+" من الزبون",amount:+d.amount||0})});(o.expenses||[]).forEach(function(d){if(d.by===p)paid.push({date:d.date,order:on,what:(d.reason||"")+(d.to?" — لـ "+d.to:""),amount:+d.amount||0})})});function srt(a,b){return String(a.date).localeCompare(b.date)}return {got:got.sort(srt),paid:paid.sort(srt)}}
function sd(d){var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?(+m[3])+'/'+(+m[2]):d}
function ledgerHTML(list){
  var one=list.length===1,oc=function(r){return one?'':'<td>'+esc(r.order)+'</td>'},oh=one?'':'<th>الطلبية</th>';
  var h='<div class="card"><h2>تفاصيل كل شخص</h2>';
  people().forEach(function(p){var L=ledger(list,p),tg=0,tp=0;L.got.forEach(function(r){tg+=r.amount});L.paid.forEach(function(r){tp+=r.amount});
    h+='<details open style="margin-bottom:12px"><summary style="font-weight:700;font-size:16px;color:var(--brand);cursor:pointer">'+esc(p)+' — استلم '+money(tg)+' • دفع '+money(tp)+'</summary>';
    h+='<h3>استلم من الزبائن</h3>'+(L.got.length?'<table><tr><th>التاريخ</th>'+oh+'<th>البيان</th><th>المبلغ</th></tr>'+L.got.map(function(r){return '<tr><td class="d">'+esc(sd(r.date))+'</td>'+oc(r)+'<td>'+esc(r.what)+'</td><td class="num in">'+money(r.amount)+'</td></tr>'}).join("")+'<tr><th colspan="'+(one?2:3)+'">المجموع</th><th class="num in">'+money(tg)+'</th></tr></table>':'<p class="muted">لا شيء.</p>');
    h+='<h3>دفع</h3>'+(L.paid.length?'<table><tr><th>التاريخ</th>'+oh+'<th>لماذا / لمن</th><th>المبلغ</th></tr>'+L.paid.map(function(r){return '<tr><td class="d">'+esc(sd(r.date))+'</td>'+oc(r)+'<td>'+esc(r.what)+'</td><td class="num out">'+money(r.amount)+'</td></tr>'}).join("")+'<tr><th colspan="'+(one?2:3)+'">المجموع</th><th class="num out">'+money(tp)+'</th></tr></table>':'<p class="muted">لا شيء.</p>');
    h+='</details>'});
  return h+'</div>';
}

function render(){
  $("switch").classList.toggle("hidden",!state.partner);
  $("title").textContent=state.partner?"حسابات "+state.partner:"حسابات الشركاء";
  if(!state.partner)return $("view").innerHTML=pickView();
  $("view").innerHTML=state.open?orderView(state.open):partnerView();
}

/* 1) اختيار الشريك */
function pickView(){
  var h='<div class="card"><h2>اختر الشريك</h2>';
  PARTNERS.forEach(function(p){var n=state.data.orders.filter(function(o){return o.partner===p}).length;h+='<label class="pick'+(state.pick===p?" on":"")+'" data-pick="'+esc(p)+'"><input type="radio" name="p"'+(state.pick===p?" checked":"")+'><span style="flex:1">'+esc(p)+'</span><span class="muted">'+n+' طلبية</span></label>'});
  h+='<button class="big" id="ok"'+(state.pick?"":" disabled style=\"opacity:.5\"")+'>موافق</button></div>';
  h+=syncCard();
  h+='<div class="card"><h2>النسخ الاحتياطي</h2><p class="muted">نسخة ملف تحفظها بنفسك (إضافة لـ GitHub).</p><div class="actions"><button class="ghost small" id="exp">حفظ نسخة احتياطية</button><button class="ghost small" id="impBtn">استرجاع نسخة</button></div></div>';
  return h;
}

/* 2) بيانات الشريك: الزبائن والطلبيات */
function partnerView(){
  var list=myOrders(),t=personTotals(list),G=0,S=0,L=0;
  list.forEach(function(o){var x=ot(o);G+=x.got;S+=x.spent;if(!o.done)L+=Math.max(0,x.left)});
  var h='<div class="card"><h2>زبون وطلبية جديدة</h2><label>اسم الزبون</label><input id="nName"><label>الطلبية</label><input id="nDesc"><div class="grid2"><div><label>السعر المتفق عليه (د.ك)</label><input id="nPrice" type="number" inputmode="decimal" step="0.001"></div><div><label>التاريخ</label><input id="nDate" type="date" value="'+today()+'"></div></div><label>رقم الزبون (اختياري)</label><input id="nPhone" inputmode="tel"><div class="actions"><button id="nAdd" style="flex:1">إضافة</button></div></div>';
  h+='<h2 style="margin:16px 4px 8px">الطلبيات</h2>';
  if(!list.length)h+='<div class="card muted" style="text-align:center">لا توجد طلبيات مع '+esc(state.partner)+' بعد.</div>';
  list.slice().sort(function(a,b){return (a.done-b.done)||String(b.date).localeCompare(a.date)}).forEach(function(o){var x=ot(o);h+='<div class="card order" data-open="'+o.id+'"><div class="top"><b>'+esc(o.customer)+'</b><span class="muted">'+esc(o.date||"")+'</span></div><div class="muted">'+esc(o.desc||"")+'</div><div class="chips"><span class="chip">السعر '+money(o.price)+'</span><span class="chip">مستلم '+money(x.got)+'</span><span class="chip">مصروف '+money(x.spent)+'</span>'+(o.done?'<span class="chip done">منتهية</span>':'<span class="chip">الباقي '+money(x.left)+'</span>')+'</div></div>'});
  h+='<div class="card total"><div class="row"><span>المستلم من الزبائن</span><span class="num">'+money(G)+'</span></div><div class="row"><span>المصروف على الطلبيات</span><span class="num">'+money(S)+'</span></div><div class="row"><span>المستلم ناقص المصروف</span><span class="num">'+money(G-S)+'</span></div><div class="row"><span>الباقي على الزبائن</span><span class="num">'+money(L)+'</span></div><div class="muted">'+list.length+' طلبية</div></div>';
  return h;
}

function opts(){return people().map(function(p){return '<option>'+esc(p)+'</option>'}).join("")}

/* ملخص PDF: يُرسم على Canvas (يدعم العربية) ثم يُوضع في ملف PDF */
function buildPages(){
  var W=1240,H=8000,M=70,pages=[],c,ctx,y,CW=W-2*M;
  var o=state.data.orders.find(function(z){return z.id===state.open}),list=[o],st=settle(list),ps=people();
  function page(){c=document.createElement("canvas");c.width=W;c.height=H;ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.direction="rtl";ctx.textBaseline="middle";pages.push(c);y=M}
  function font(s,b){ctx.font=(b?"bold ":"")+s+"px Tahoma, Arial, sans-serif"}
  function txt(s,x,size,bold,color,align){font(size,bold);ctx.fillStyle=color||"#1d2433";ctx.textAlign=align||"right";ctx.fillText(s,x,y)}
  function fit(s,w,size,bold){font(size,bold);s=String(s==null?"":s);if(ctx.measureText(s).width<=w)return s;while(s.length>1&&ctx.measureText(s+"…").width>w)s=s.slice(0,-1);return s+"…"}
  function need(h){if(y+h>H-M-30)page()}
  function rect(x,yy,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,yy,w,h)}
  function heading(t,col){need(70);rect(M,y,CW,52,col||"#1f3a5f");y+=26;txt(t,W-M-18,26,true,"#fff");y+=44}
  /* جدول: الأعمدة من اليمين؛ widths بنسب من عرض الصفحة */
  function table(cols,rows,total,amountColor){
    var ws=cols.map(function(cl){return cl.w*CW}),RH=46;
    function head(){need(RH*2);rect(M,y,CW,RH,"#eef3fa");var x=W-M;y+=RH/2;cols.forEach(function(cl,i){txt(cl.t,x-12,20,true,"#6b7385");x-=ws[i]});y+=RH/2}
    head();
    rows.forEach(function(r,ri){if(y+RH>H-M-30){page();head()}var x=W-M;y+=RH/2;cols.forEach(function(cl,i){var v=r[i],last=i===cols.length-1;txt(fit(v,ws[i]-20,21,last),last?x-ws[i]+12:x-12,21,last,last?amountColor:"#1d2433",last?"left":"right");x-=ws[i]});y+=RH/2;rect(M,y,CW,1,"#e3e7ee")});
    if(total!=null){need(RH);y+=RH/2;txt("المجموع",W-M-12,22,true);txt(money(total),M+12,22,true,amountColor,"left");y+=RH/2+6}
    y+=14;
  }
  page();
  rect(0,0,W,180,"#1f3a5f");y=62;txt(fit("طلبية: "+o.customer+(o.desc?" — "+o.desc:""),CW,40,true),W-M,40,true,"#fff");y=122;txt("الشريكان: "+ME+" و"+state.partner+"   •   تاريخ الطلبية "+(o.date||"")+"   •   القسمة 50% × 50%",W-M,22,false,"#d6deea");
  y=220;
  heading("الملخص");
  [["سعر الطلبية",st.price],["المصروفات",st.spent],["صافي الربح",st.profit],["الباقي على الزبون",st.left]].forEach(function(r,i){y+=22;txt(r[0],W-M-12,24,i===2);txt(money(r[1]),M+12,24,true,i===2?"#0f7b4f":"#1d2433","left");y+=24});
  y+=16;
  table([{t:"",w:.28},{t:"استلم",w:.18},{t:"دفع",w:.18},{t:"نصيبه",w:.18},{t:"باقي له / عليه",w:.18}],ps.map(function(p){var x=st.t[p];return [p,money(x.got),money(x.paid),money(x.share),(x.due>=0?"له ":"عليه ")+money(Math.abs(x.due))]}),null,"#1f3a5f");
  var stx=settleText(st);font(26,true);var lines=[],cur="";stx.split(" ").forEach(function(w0){var tr=cur?cur+" "+w0:w0;if(ctx.measureText(tr).width>CW-40&&cur){lines.push(cur);cur=w0}else cur=tr});lines.push(cur);
  need(30+lines.length*42);rect(M,y,CW,24+lines.length*42,"#0f7b4f");y+=12+21;lines.forEach(function(l){txt(l,W/2,26,true,"#fff","center");y+=42});y+=24;
  ps.forEach(function(p){
    var L=ledger(list,p),tg=0,tp=0;L.got.forEach(function(r){tg+=r.amount});L.paid.forEach(function(r){tp+=r.amount});
    heading("تفاصيل "+p);
    need(170);y+=14;txt("ما استلمه من الزبائن",W-M,24,true,"#0f7b4f");y+=34;
    if(L.got.length)table([{t:"التاريخ",w:.2},{t:"البيان",w:.55},{t:"المبلغ",w:.25}],L.got.map(function(r){return [r.date,r.what,money(r.amount)]}),tg,"#0f7b4f");else{txt("لا شيء",W-M-12,21,false,"#6b7385");y+=40}
    need(170);txt("ما دفعه",W-M,24,true,"#b3261e");y+=34;
    if(L.paid.length)table([{t:"التاريخ",w:.2},{t:"لماذا / لمن",w:.55},{t:"المبلغ",w:.25}],L.paid.map(function(r){return [r.date,r.what,money(r.amount)]}),tp,"#b3261e");else{txt("لا شيء",W-M-12,21,false,"#6b7385");y+=40}
    var x=st.t[p];need(50);y+=10;txt("نصيبه من الربح "+money(x.share)+"   •   "+(x.due>=0?"باقي له ":"عليه ")+money(Math.abs(x.due)),W-M,24,true,"#1f3a5f");y+=50;
  });
  /* صفحة واحدة بطول المحتوى */
  var fh=Math.max(Math.round(W*1.414),y+M),out=document.createElement("canvas");out.width=W;out.height=fh;var oc=out.getContext("2d");oc.fillStyle="#fff";oc.fillRect(0,0,W,fh);oc.drawImage(pages[0],0,0);
  return [out];
}
function dataURLBytes(u){var b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function makePDF(canvases){
  var parts=[],len=0,offs=[],enc=new TextEncoder();
  function add(x){var b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length}
  function obj(n,body){offs[n]=len;add(n+" 0 obj\n");body.forEach(add);add("\nendobj\n")}
  var n=canvases.length,kids=[];for(var i=0;i<n;i++)kids.push((3+i*3)+" 0 R");
  add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2,["<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>"]);
  canvases.forEach(function(cv,i){
    var p=3+i*3,ph=Math.round(595*cv.height/cv.width),img=dataURLBytes(cv.toDataURL("image/jpeg",0.85)),cs="q 595 0 0 "+ph+" 0 0 cm /Im0 Do Q";
    obj(p,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 "+ph+"] /Resources << /XObject << /Im0 "+(p+1)+" 0 R >> >> /Contents "+(p+2)+" 0 R >>"]);
    obj(p+1,["<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+img.length+" >>\nstream\n",img,"\nendstream"]);
    obj(p+2,["<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"]);
  });
  var total=2+n*3,xref=len,s="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var k=1;k<=total;k++)s+=String(offs[k]).padStart(10,"0")+" 00000 n \n";
  add(s+"trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function sendPDF(){
  var od=state.data.orders.find(function(z){return z.id===state.open});var blob=makePDF(buildPages()),name="طلبية-"+String(od.customer).replace(/[\s\/\\:*?"<>|]+/g,"-")+"-"+(od.date||today())+".pdf";
  var file=new File([blob],name,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"ملخص طلبية "+od.customer});return}catch(e){if(e&&e.name==="AbortError")return}}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("تم تنزيل الملف، أرسله من واتساب");
}

function val(id){var e=$(id);return e?e.value.trim():""}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("button,[data-open],[data-pick]");if(!t)return;
  if(t.dataset.pick){state.pick=t.dataset.pick;return render()}

  if(t.id==="ghConnect")return connectGH();

  if(t.id==="ghPull")return pullGH();

  if(t.id==="impBtn")return $("imp").click();

  if(t.dataset.editd&&o){state.edit={type:"dep",id:t.dataset.editd};render();var f1=$("dAmt");if(f1)f1.scrollIntoView({block:"center"});return}
  if(t.dataset.edite&&o){state.edit={type:"exp",id:t.dataset.edite};render();var f2=$("eAmt");if(f2)f2.scrollIntoView({block:"center"});return}
  if(t.id==="dAdd"&&o){var am=+val("dAmt");if(!am)return toast("اكتب المبلغ");var rec={amount:am,by:val("dBy"),note:val("dNote"),date:val("dDate")||today()};var cur=state.edit&&state.edit.type==="dep"&&o.deposits.find(function(z){return z.id===state.edit.id});if(cur)Object.assign(cur,rec);else{rec.id=uid();o.deposits.push(rec)}state.edit=null;save();return render()}
  if(t.id==="eAdd"&&o){var b2=+val("eAmt");if(!b2)return toast("اكتب المبلغ");if(!val("eWhy"))return toast("اكتب سبب الدفع");var rec2={amount:b2,by:val("eBy"),reason:val("eWhy"),to:val("eTo"),date:val("eDate")||today()};var cur2=state.edit&&state.edit.type==="exp"&&o.expenses.find(function(z){return z.id===state.edit.id});if(cur2)Object.assign(cur2,rec2);else{rec2.id=uid();o.expenses.push(rec2)}state.edit=null;save();return render()}

});
